<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Hospital Queue</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    margin: 0;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
}

.language {
    text-align: right;
}

select, input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.language select {
    width: auto;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.current {
    text-align: center;
    background: #e0f2fe;
    margin-top: 20px;
    padding: 20px;
    border-radius: 10px;
}

#current {
    font-size: 40px;
    font-weight: bold;
}

.queue {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="language">
    <select id="language">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="mr">मराठी</option>
    </select>
</div>

<h1 id="title">Smart Hospital Queue</h1>

<label id="nameLabel">Patient Name</label>
<input id="name" type="text" placeholder="Enter patient name">

<label id="phoneLabel">Mobile Number</label>
<input id="phone" type="tel" placeholder="Enter mobile number">

<button id="tokenBtn">Get Token</button>

<div class="current">
    <h2 id="currentTitle">Current Token</h2>
    <div id="current">0</div>
</div>

<button id="nextBtn">Next Patient</button>

<div class="queue">
    <h3 id="waitingTitle">Waiting List</h3>
    <div id="list"></div>
</div>

</div>


<script>

let queue = [];
let current = 0;
let language = "en";


const text = {

en: {
title: "Smart Hospital Queue",
name: "Patient Name",
namePlaceholder: "Enter patient name",
phone: "Mobile Number",
phonePlaceholder: "Enter mobile number",
token: "Get Token",
current: "Current Token",
next: "Next Patient",
waiting: "Waiting List",
empty: "No patients waiting",
enter: "Please enter name and mobile number",
generated: "Token Generated: "
},

hi: {
title: "स्मार्ट हॉस्पिटल कतार प्रणाली",
name: "मरीज का नाम",
namePlaceholder: "मरीज का नाम दर्ज करें",
phone: "मोबाइल नंबर",
phonePlaceholder: "मोबाइल नंबर दर्ज करें",
token: "टोकन लें",
current: "वर्तमान टोकन",
next: "अगला मरीज",
waiting: "प्रतीक्षा सूची",
empty: "कोई मरीज प्रतीक्षा में नहीं है",
enter: "कृपया नाम और मोबाइल नंबर दर्ज करें",
generated: "टोकन प्राप्त हुआ: "
},

mr: {
title: "स्मार्ट हॉस्पिटल रांग प्रणाली",
name: "रुग्णाचे नाव",
namePlaceholder: "रुग्णाचे नाव टाका",
phone: "मोबाईल नंबर",
phonePlaceholder: "मोबाईल नंबर टाका",
token: "टोकन घ्या",
current: "सध्याचा टोकन",
next: "पुढील रुग्ण",
waiting: "प्रतीक्षा यादी",
empty: "कोणतेही रुग्ण प्रतीक्षेत नाहीत",
enter: "कृपया नाव आणि मोबाईल नंबर टाका",
generated: "टोकन मिळाले: "
}

};


function changeLanguage() {

    language = document.getElementById("language").value;

    let t = text[language];

    document.getElementById("title").textContent = t.title;

    document.getElementById("nameLabel").textContent = t.name;

    document.getElementById("name").placeholder =
        t.namePlaceholder;

    document.getElementById("phoneLabel").textContent =
        t.phone;

    document.getElementById("phone").placeholder =
        t.phonePlaceholder;

    document.getElementById("tokenBtn").textContent =
        t.token;

    document.getElementById("currentTitle").textContent =
        t.current;

    document.getElementById("nextBtn").textContent =
        t.next;

    document.getElementById("waitingTitle").textContent =
        t.waiting;

    showQueue();
}


document
.getElementById("language")
.addEventListener("change", changeLanguage);


function addPatient() {

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    if (name === "" || phone === "") {

        alert(text[language].enter);

        return;
    }

    let token = queue.length + current + 1;

    queue.push({
        name: name,
        phone: phone,
        token: token
    });

    alert(text[language].generated + token);

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";

    showQueue();
}


function nextPatient() {

    if (queue.length === 0) {

        alert(text[language].empty);

        return;
    }

    let patient = queue.shift();

    current = patient.token;

    document.getElementById("current").textContent =
        current;

    showQueue();
}


function showQueue() {

    let list =
        document.getElementById("list");

    if (queue.length === 0) {

        list.innerHTML =
            "<p>" + text[language].empty + "</p>";

        return;
    }

    let output = "";

    queue.forEach(function(patient) {

        output +=
            "<p>Token " +
            patient.token +
            " - " +
            patient.name +
            "</p>";

    });

    list.innerHTML = output;
}


document
.getElementById("tokenBtn")
.addEventListener("click", addPatient);


document
.getElementById("nextBtn")
.addEventListener("click", nextPatient);


</script>

</body>
</html>
