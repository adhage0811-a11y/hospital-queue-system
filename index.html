<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Hospital Queue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .language-box {
            text-align: right;
            margin-bottom: 20px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .language-box select {
            width: auto;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .current-box {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: #e0f2fe;
            border-radius: 10px;
        }

        #current {
            font-size: 40px;
            font-weight: bold;
            margin-top: 10px;
        }

        .queue {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .queue h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LANGUAGE -->
    <div class="language-box">
        <select id="language" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="mr">मराठी</option>
        </select>
    </div>

    <!-- TITLE -->
    <h1 id="title">Smart Hospital Queue</h1>

    <!-- PATIENT NAME -->
    <label id="nameLabel">Patient Name</label>
    <input
        type="text"
        id="name"
        placeholder="Enter patient name"
    >

    <!-- MOBILE -->
    <label id="phoneLabel">Mobile Number</label>
    <input
        type="tel"
        id="phone"
        placeholder="Enter mobile number"
    >

    <!-- TOKEN BUTTON -->
    <button id="tokenBtn" onclick="addPatient()">
        Get Token
    </button>

    <!-- CURRENT TOKEN -->
    <div class="current-box">
        <h2 id="currentTitle">Current Token</h2>
        <div id="current">0</div>
    </div>

    <!-- NEXT PATIENT -->
    <button id="nextBtn" onclick="nextPatient()">
        Next Patient
    </button>

    <!-- WAITING LIST -->
    <div class="queue" id="list">
        <h3 id="waitingTitle">Waiting List</h3>
        <p id="emptyMessage">No patients waiting</p>
    </div>

</div>


<script>

let queue = [];
let current = 0;
let lang = "en";


/* =========================
   LANGUAGE DATA
========================= */

const translations = {

    en: {
        title: "Smart Hospital Queue",
        name: "Patient Name",
        namePlaceholder: "Enter patient name",
        phone: "Mobile Number",
        phonePlaceholder: "Enter mobile number",
        tokenBtn: "Get Token",
        current: "Current Token",
        next: "Next Patient",
        waiting: "Waiting List",
        empty: "No patients waiting",

        enterDetails: "Please enter name and mobile number",
        tokenGenerated: "Token Generated: ",
        noPatients: "No patients waiting",

        sms: "Hello {name}, Your token {token} is ready at hospital."
    },

    hi: {
        title: "स्मार्ट हॉस्पिटल कतार प्रणाली",
        name: "मरीज का नाम",
        namePlaceholder: "मरीज का नाम दर्ज करें",
        phone: "मोबाइल नंबर",
        phonePlaceholder: "मोबाइल नंबर दर्ज करें",
        tokenBtn: "टोकन लें",
        current: "वर्तमान टोकन",
        next: "अगला मरीज",
        waiting: "प्रतीक्षा सूची",
        empty: "कोई मरीज प्रतीक्षा में नहीं है",

        enterDetails: "कृपया नाम और मोबाइल नंबर दर्ज करें",
        tokenGenerated: "टोकन प्राप्त हुआ: ",
        noPatients: "कोई मरीज प्रतीक्षा में नहीं है",

        sms: "नमस्ते {name}, आपका टोकन {token} अस्पताल में तैयार है।"
    },

    mr: {
        title: "स्मार्ट हॉस्पिटल रांग प्रणाली",
        name: "रुग्णाचे नाव",
        namePlaceholder: "रुग्णाचे नाव टाका",
        phone: "मोबाईल नंबर",
        phonePlaceholder: "मोबाईल नंबर टाका",
        tokenBtn: "टोकन घ्या",
        current: "सध्याचा टोकन",
        next: "पुढील रुग्ण",
        waiting: "प्रतीक्षा यादी",
        empty: "कोणतेही रुग्ण प्रतीक्षेत नाहीत",

        enterDetails: "कृपया नाव आणि मोबाईल नंबर टाका",
        tokenGenerated: "टोकन मिळाले: ",
        noPatients: "कोणतेही रुग्ण प्रतीक्षेत नाहीत",

        sms: "नमस्कार {name}, तुमचा टोकन {token} हॉस्पिटलमध्ये तयार आहे."
    }

};


/* =========================
   ADD PATIENT
========================= */

function addPatient() {

    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();

    if (name === "" || phone === "") {

        alert(translations[lang].enterDetails);

        return;
    }

    let token = queue.length + current + 1;

    queue.push({
        name: name,
        phone: phone,
        token: token
    });

    alert(translations[lang].tokenGenerated + token);

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";

    showQueue();
}


/* =========================
   NEXT PATIENT
========================= */

function nextPatient() {

    if (queue.length === 0) {

        alert(translations[lang].noPatients);

        return;
    }

    let patient = queue.shift();

    current = patient.token;

    document.getElementById("current").innerText = current;

    openSMS(
        patient.phone,
        patient.name,
        patient.token
    );

    showQueue();
}


/* =========================
   SHOW QUEUE
========================= */

function showQueue() {

    let list = document.getElementById("list");

    let text =
        "<h3>" +
        translations[lang].waiting +
        "</h3>";

    if (queue.length === 0) {

        text +=
            "<p>" +
            translations[lang].empty +
            "</p>";

    } else {

        queue.forEach(function(patient) {

            text +=
                "<p>Token " +
                patient.token +
                " - " +
                patient.name +
                "</p>";

        });
    }

    list.innerHTML = text;
}


/* =========================
   SMS
========================= */

function openSMS(number, name, token) {

    let message =
        translations[lang].sms
        .replace("{name}", name)
        .replace("{token}", token);

    let link =
        "sms:" +
        number +
        "?body=" +
        encodeURIComponent(message);

    window.location.href = link;
}


/* =========================
   CHANGE LANGUAGE
========================= */

function changeLanguage() {

    lang =
        document.getElementById("language").value;

    let t = translations[lang];

    document.getElementById("title").innerText =
        t.title;

    document.getElementById("nameLabel").innerText =
        t.name;

    document.getElementById("name").placeholder =
        t.namePlaceholder;

    document.getElementById("phoneLabel").innerText =
        t.phone;

    document.getElementById("phone").placeholder =
        t.phonePlaceholder;

    document.getElementById("tokenBtn").innerText =
        t.tokenBtn;

    document.getElementById("currentTitle").innerText =
        t.current;

    document.getElementById("nextBtn").innerText =
        t.next;

    showQueue();
}


/* =========================
   START
========================= */

changeLanguage();

</script>

</body>
</html>
