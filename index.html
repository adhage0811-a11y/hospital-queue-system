<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Hospital Queue System</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:650px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

h1{
    color:#1976d2;
}

select,input,button{
    width:90%;
    padding:12px;
    margin:10px;
    font-size:16px;
    border-radius:8px;
    box-sizing:border-box;
}

input,select{
    border:1px solid #ccc;
}

button{
    border:none;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#125ea8;
}

.box{
    margin-top:20px;
    padding:20px;
    border-radius:10px;
    background:#e3f2fd;
}

.prediction-box{
    background:#fff3cd;
}

#current{
    font-size:50px;
    color:#1976d2;
}

#prediction{
    font-size:20px;
    font-weight:bold;
    color:#d35400;
}

#list{
    text-align:left;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Smart Hospital Queue System</h1>

<select id="language" onchange="changeLanguage()">
    <option value="en">English</option>
    <option value="hi">हिंदी</option>
    <option value="mr">मराठी</option>
</select>

<input
    type="text"
    id="name"
    placeholder="Enter Patient Name"
>

<input
    type="tel"
    id="phone"
    placeholder="Enter Mobile Number"
>

<button id="tokenBtn" onclick="addPatient()">
    Get Token
</button>


<div class="box">

<h2 id="currentText">Current Token</h2>

<h1 id="current">0</h1>

<button id="nextBtn" onclick="nextPatient()">
    Next Patient
</button>

</div>


<div class="box prediction-box">

<h2 id="predictionTitle">
    AI Estimated Waiting Time
</h2>

<p id="prediction">
    No patients waiting
</p>

</div>


<div class="box" id="list">

<h3>Waiting List</h3>

No patients waiting.

</div>

</div>


<script>

let queue = [];

let current = 0;

let averageConsultationTime = 10;

let currentLanguage = "en";


const translations = {

en:{
    title:"Smart Hospital Queue System",
    name:"Enter Patient Name",
    phone:"Enter Mobile Number",
    token:"Get Token",
    current:"Current Token",
    next:"Next Patient",
    predictionTitle:"AI Estimated Waiting Time",
    waiting:"Waiting List",
    noPatients:"No patients waiting.",
    error:"Please enter patient name and mobile number",
    tokenGenerated:"Token Generated: ",
    estimated:"Estimated Waiting Time: ",
    minutes:" minutes"
},

hi:{
    title:"स्मार्ट हॉस्पिटल कतार प्रणाली",
    name:"मरीज का नाम दर्ज करें",
    phone:"मोबाइल नंबर दर्ज करें",
    token:"टोकन प्राप्त करें",
    current:"वर्तमान टोकन",
    next:"अगला मरीज",
    predictionTitle:"AI अनुमानित प्रतीक्षा समय",
    waiting:"प्रतीक्षा सूची",
    noPatients:"कोई मरीज प्रतीक्षा में नहीं है।",
    error:"कृपया मरीज का नाम और मोबाइल नंबर दर्ज करें",
    tokenGenerated:"टोकन बनाया गया: ",
    estimated:"अनुमानित प्रतीक्षा समय: ",
    minutes:" मिनट"
},

mr:{
    title:"स्मार्ट हॉस्पिटल रांग प्रणाली",
    name:"रुग्णाचे नाव टाका",
    phone:"मोबाईल नंबर टाका",
    token:"टोकन मिळवा",
    current:"सध्याचा टोकन",
    next:"पुढील रुग्ण",
    predictionTitle:"AI अंदाजे प्रतीक्षा वेळ",
    waiting:"प्रतीक्षा यादी",
    noPatients:"कोणताही रुग्ण प्रतीक्षेत नाही.",
    error:"कृपया रुग्णाचे नाव आणि मोबाईल नंबर टाका",
    tokenGenerated:"टोकन तयार झाला: ",
    estimated:"अंदाजे प्रतीक्षा वेळ: ",
    minutes:" मिनिटे"
}

};


/* LANGUAGE CHANGE */

function changeLanguage(){

    currentLanguage =
        document.getElementById("language").value;

    let t =
        translations[currentLanguage];

    document.getElementById("title").innerText =
        t.title;

    document.getElementById("name").placeholder =
        t.name;

    document.getElementById("phone").placeholder =
        t.phone;

    document.getElementById("tokenBtn").innerText =
        t.token;

    document.getElementById("currentText").innerText =
        t.current;

    document.getElementById("nextBtn").innerText =
        t.next;

    document.getElementById("predictionTitle").innerText =
        t.predictionTitle;

    predictWaitingTime();

    showQueue();
}


/* ADD PATIENT */

function addPatient(){

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let t =
        translations[currentLanguage];


    if(name === "" || phone === ""){

        alert(t.error);

        return;
    }


    phone =
        phone.replace(/\D/g, "");


    if(phone.length > 10){

        phone =
            phone.slice(-10);
    }


    if(phone.length !== 10){

        alert("Please enter a valid 10 digit mobile number");

        return;
    }


    let token =
        current + queue.length + 1;


    queue.push({

        name:name,

        phone:phone,

        token:token

    });


    let estimatedTime =
        (queue.length - 1) *
        averageConsultationTime;


    alert(
        t.tokenGenerated +
        token +
        "\n" +
        t.estimated +
        estimatedTime +
        t.minutes
    );


    document.getElementById("name").value =
        "";

    document.getElementById("phone").value =
        "";


    predictWaitingTime();

    showQueue();
}


/* NEXT PATIENT + SMS MESSAGE */

function nextPatient(){

    let t =
        translations[currentLanguage];


    if(queue.length === 0){

        alert(t.noPatients);

        return;
    }


    let patient =
        queue.shift();


    current =
        patient.token;


    document.getElementById("current").innerText =
        current;


    let message;


    if(currentLanguage === "hi"){

        message =
            "नमस्ते " +
            patient.name +
            "\n\nआपका टोकन नंबर " +
            patient.token +
            " अब आ गया है।" +
            "\nकृपया अस्पताल में डॉक्टर के पास आएं।";

    }

    else if(currentLanguage === "mr"){

        message =
            "नमस्कार " +
            patient.name +
            "\n\nतुमचा टोकन नंबर " +
            patient.token +
            " आता आला आहे." +
            "\nकृपया हॉस्पिटलमध्ये डॉक्टरांकडे या.";

    }

    else{

        message =
            "Hello " +
            patient.name +
            "\n\nYour token number " +
            patient.token +
            " is now active." +
            "\nPlease come to the hospital and meet the doctor.";

    }


    let phone =
        patient.phone;


    let smsURL =
        "sms:+91" +
        phone +
        "?body=" +
        encodeURIComponent(message);


    window.location.href =
        smsURL;


    predictWaitingTime();

    showQueue();
}


/* AI WAITING TIME PREDICTION */

function predictWaitingTime(){

    let t =
        translations[currentLanguage];


    let patientsWaiting =
        queue.length;


    let estimatedTime =
        patientsWaiting *
        averageConsultationTime;


    if(patientsWaiting === 0){

        document.getElementById("prediction").innerText =
            t.noPatients;

    }

    else{

        document.getElementById("prediction").innerText =
            t.estimated +
            estimatedTime +
            t.minutes;

    }
}


/* SHOW WAITING LIST */

function showQueue(){

    let t =
        translations[currentLanguage];


    let text =
        "<h3>" +
        t.waiting +
        "</h3>";


    if(queue.length === 0){

        text +=
            t.noPatients;

    }

    else{

        queue.forEach(function(patient){

            text +=
                "Token " +
                patient.token +
                " - " +
                patient.name +
                "<br>";

        });

    }


    document.getElementById("list").innerHTML =
        text;
}


/* START */

changeLanguage();

</script>

</body>
</html>
