<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital Queue System</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
        }


        /* HEADER */

        header {
            background: #0d6efd;
            color: white;
            padding: 15px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 10px;
        }

        header h2 {
            margin: 0;
        }


        /* LANGUAGE */

        .language-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #languageSelect {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }


        /* MAIN */

        .container {
            max-width: 750px;
            margin: 30px auto;

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }


        h1 {
            text-align: center;
            color: #0d6efd;
        }


        /* FORM */

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }


        /* BUTTON */

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }


        .generate-btn {
            background: #0d6efd;
        }

        .generate-btn:hover {
            background: #0958c7;
        }


        .next-btn {
            background: #198754;
        }

        .next-btn:hover {
            background: #146c43;
        }


        /* TOKEN */

        .token-box {
            margin-top: 25px;

            padding: 20px;

            background: #e7f1ff;

            border-radius: 10px;

            text-align: center;
        }


        .token-number {
            font-size: 45px;

            font-weight: bold;

            color: #0d6efd;

            margin-top: 5px;
        }


        /* CURRENT PATIENT */

        .current-box {
            margin-top: 25px;

            padding: 20px;

            background: #e8f5e9;

            border-radius: 10px;

            text-align: center;
        }


        .current-number {
            font-size: 45px;

            font-weight: bold;

            color: #198754;
        }


        /* WAITING LIST */

        .waiting {
            margin-top: 30px;
        }


        .patient {
            background: #f8f9fa;

            border: 1px solid #ddd;

            padding: 14px;

            margin-bottom: 10px;

            border-radius: 8px;
        }


        .patient strong {
            color: #0d6efd;

            font-size: 18px;
        }


        .empty {
            text-align: center;

            color: #777;

            padding: 15px;
        }


        /* MESSAGE */

        .message-box {
            margin-top: 20px;

            padding: 15px;

            background: #fff3cd;

            border: 1px solid #ffe69c;

            border-radius: 8px;

            display: none;
        }


        /* MOBILE */

        @media(max-width:600px) {

            header {
                flex-direction: column;

                align-items: stretch;

                text-align: center;
            }

            .language-box {
                justify-content: center;
            }

            .container {
                margin: 15px;

                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h2 id="hospitalTitle">
        🏥 Hospital Queue System
    </h2>


    <div class="language-box">

        <span id="languageLabel">
            🌐 Language:
        </span>


        <select
            id="languageSelect"
            onchange="changeLanguage()">

            <option value="en">
                English
            </option>

            <option value="hi">
                हिंदी
            </option>

            <option value="mr">
                मराठी
            </option>

        </select>

    </div>

</header>



<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container">


    <h1 id="patientRegistration">
        Patient Registration
    </h1>


    <!-- PATIENT NAME -->

    <div class="form-group">

        <label
            id="nameLabel"
            for="name">

            Patient Name

        </label>


        <input
            type="text"
            id="name"
            placeholder="Enter patient name">

    </div>



    <!-- MOBILE NUMBER -->

    <div class="form-group">

        <label
            id="phoneLabel"
            for="phone">

            Mobile Number

        </label>


        <input
            type="tel"
            id="phone"
            placeholder="Enter mobile number">

    </div>



    <!-- GENERATE TOKEN -->

    <button
        class="generate-btn"
        id="generateButton"
        onclick="addPatient()">

        Generate Token

    </button>



    <!-- =========================================
         TOKEN DISPLAY
    ========================================= -->

    <div class="token-box">

        <div id="yourTokenText">

            Your Token Number

        </div>


        <div
            class="token-number"
            id="tokenNumber">

            -

        </div>

    </div>



    <!-- =========================================
         CURRENT PATIENT
    ========================================= -->

    <div class="current-box">

        <h2 id="currentTitle">

            Current Patient

        </h2>


        <div
            class="current-number"
            id="currentToken">

            -

        </div>

    </div>



    <!-- =========================================
         NEXT PATIENT
    ========================================= -->

    <button
        class="next-btn"
        id="nextButton"
        onclick="nextPatient()">

        Next Patient

    </button>



    <!-- =========================================
         MESSAGE
    ========================================= -->

    <div
        class="message-box"
        id="messageBox">

    </div>



    <!-- =========================================
         WAITING LIST
    ========================================= -->

    <div class="waiting">

        <h2 id="waitingTitle">

            Waiting List

        </h2>


        <div id="waitingList">

            <div class="empty">

                No patients waiting

            </div>

        </div>

    </div>


</div>



<script>


// =========================================
// QUEUE VARIABLES
// =========================================

let queue = [];

let tokenCounter = 0;

let currentToken = 0;



// =========================================
// ADD PATIENT
// =========================================

function addPatient() {


    let name =
        document
        .getElementById("name")
        .value
        .trim();


    let phone =
        document
        .getElementById("phone")
        .value
        .trim();



    // CHECK EMPTY

    if (name === "" || phone === "") {


        let language =
            document
            .getElementById("languageSelect")
            .value;


        if (language === "en") {

            alert(
                "Please enter patient name and mobile number."
            );

        }


        else if (language === "hi") {

            alert(
                "कृपया मरीज का नाम और मोबाइल नंबर दर्ज करें।"
            );

        }


        else {

            alert(
                "कृपया रुग्णाचे नाव आणि मोबाईल नंबर टाका."
            );

        }


        return;

    }



    // CREATE TOKEN

    tokenCounter++;



    let patient = {

        name: name,

        phone: phone,

        token: tokenCounter

    };



    // ADD TO QUEUE

    queue.push(patient);



    // SHOW TOKEN

    document
        .getElementById("tokenNumber")
        .innerText = tokenCounter;



    // CLEAR INPUT

    document
        .getElementById("name")
        .value = "";


    document
        .getElementById("phone")
        .value = "";



    // UPDATE WAITING LIST

    showWaitingList();



    // SUCCESS MESSAGE

    let language =
        document
        .getElementById("languageSelect")
        .value;



    if (language === "en") {

        alert(
            "Token generated successfully!\n\n" +
            "Token Number: " +
            tokenCounter
        );

    }


    else if (language === "hi") {

        alert(
            "टोकन सफलतापूर्वक जनरेट हो गया!\n\n" +
            "टोकन नंबर: " +
            tokenCounter
        );

    }


    else {

        alert(
            "टोकन यशस्वीरित्या तयार झाले!\n\n" +
            "टोकन नंबर: " +
            tokenCounter
        );

    }

}



// =========================================
// NEXT PATIENT
// =========================================

function nextPatient() {


    // NO PATIENT

    if (queue.length === 0) {


        let language =
            document
            .getElementById("languageSelect")
            .value;


        if (language === "en") {

            alert(
                "No patients waiting."
            );

        }


        else if (language === "hi") {

            alert(
                "कोई मरीज प्रतीक्षा में नहीं है।"
            );

        }


        else {

            alert(
                "कोणतेही रुग्ण प्रतीक्षेत नाहीत."
            );

        }


        return;

    }



    // TAKE FIRST PATIENT

    let patient =
        queue.shift();



    // CURRENT TOKEN

    currentToken =
        patient.token;



    document
        .getElementById("currentToken")
        .innerText = currentToken;



    // UPDATE LIST

    showWaitingList();



    // OPEN MESSAGE

    showPatientMessage(patient);

}



// =========================================
// SHOW PATIENT MESSAGE WINDOW
// =========================================

function showPatientMessage(patient) {


    let language =
        document
        .getElementById("languageSelect")
        .value;



    let message = "";



    // ENGLISH

    if (language === "en") {


        message =
            "Hello " +
            patient.name +
            ", your turn has arrived. " +
            "Please come to the hospital. " +
            "Your token number is " +
            patient.token +
            ".";

    }



    // HINDI

    else if (language === "hi") {


        message =
            "नमस्ते " +
            patient.name +
            ", आपकी बारी आ गई है। " +
            "कृपया अस्पताल में आएं। " +
            "आपका टोकन नंबर " +
            patient.token +
            " है।";

    }



    // MARATHI

    else {


        message =
            "नमस्कार " +
            patient.name +
            ", तुमची बारी आली आहे। " +
            "कृपया हॉस्पिटलमध्ये या। " +
            "तुमचा टोकन नंबर " +
            patient.token +
            " आहे।";

    }



    // OPEN NEW MESSAGE WINDOW

    let messageWindow =
        window.open(
            "",
            "PatientMessage",
            "width=450,height=550"
        );



    // IF POPUP BLOCKED

    if (!messageWindow) {

        alert(
            "Please allow pop-ups for this website."
        );

        return;

    }



    // MESSAGE WINDOW HTML

    messageWindow.document.write(`

<html>

<head>

<meta charset="UTF-8">

<title>Patient Message</title>


<style>

body {

    margin: 0;

    padding: 20px;

    font-family: Arial, sans-serif;

.chat {

    background: white;

    border-radius: 12px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.15);

}


h2 {

    margin-top: 0;

    color: #0d6efd;

    text-align: center;

}


.patient-info {

    background: #f8f9fa;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 15px;

}


textarea {

    width: 100%;

    height: 160px;

    padding: 12px;

    box-sizing: border-box;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

    resize: none;

}


button {

    width: 100%;

    padding: 13px;

    margin-top: 15px;

    background: #0d6efd;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 17px;

}

    background: #0958c7;

</head>

</h2>

</div>

📤 Send

function sendMessage() {

    alert(
        "Message is ready to send to ${patient.phone}"
    );

}

</body>

    `);



    messageWindow.document.close();

}



// =========================================
// WAITING LIST
// =========================================

function showWaitingList() {


    let list =
        document
        .getElementById("waitingList");



    // EMPTY

    if (queue.length === 0) {


        list.innerHTML =

            '<div class="empty">' +

            getText("empty") +

            '</div>';

        return;

    }



    // CLEAR LIST

    list.innerHTML = "";



    // DISPLAY PATIENTS

    queue.forEach(function(patient) {


        let div =
            document.createElement("div");


        div.className =
            "patient";



        div.innerHTML =

            "<strong>" +

            getText("token") +

            " " +

            patient.token +

            "</strong><br><br>" +


            getText("name") +

            ": " +

            patient.name +

            "<br>" +


            getText("mobile") +

            ": " +

            patient.phone;



        list.appendChild(div);

    });

}



// =========================================
// TRANSLATION TEXT
// =========================================

function getText(type) {


    let language =
        document
        .getElementById("languageSelect")
        .value;



    let text = {


        en: {

            token: "Token",

            name: "Name",

            mobile: "Mobile",

            empty:
                "No patients waiting"

        },


        hi: {

            token: "टोकन",

            name: "नाम",

            mobile: "मोबाइल",

            empty:
                "कोई मरीज प्रतीक्षा में नहीं है"

        },


        mr: {

            token: "टोकन",

            name: "नाव",

            mobile: "मोबाईल",

            empty:
                "कोणतेही रुग्ण प्रतीक्षेत नाहीत"

        }

    };



    return text[language][type];

}



// =========================================
// CHANGE LANGUAGE
// =========================================

function changeLanguage() {


    let language =
        document
        .getElementById("languageSelect")
        .value;



    // =========================
    // ENGLISH
    // =========================

    if (language === "en") {


        document
        .getElementById("hospitalTitle")
        .innerText =
            "🏥 Hospital Queue System";


        document
        .getElementById("languageLabel")
        .innerText =
            "🌐 Language:";


        document
        .getElementById("patientRegistration")
        .innerText =
            "Patient Registration";


        document
        .getElementById("nameLabel")
        .innerText =
            "Patient Name";


        document
        .getElementById("phoneLabel")
        .innerText =
            "Mobile Number";


        document
        .getElementById("name")
        .placeholder =
            "Enter patient name";


        document
        .getElementById("phone")
        .placeholder =
            "Enter mobile number";


        document
        .getElementById("generateButton")
        .innerText =
            "Generate Token";


        document
        .getElementById("yourTokenText")
        .innerText =
            "Your Token Number";


        document
        .getElementById("currentTitle")
        .innerText =
            "Current Patient";


        document
        .getElementById("nextButton")
        .innerText =
            "Next Patient";


        document
        .getElementById("waitingTitle")
        .innerText =
            "Waiting List";

    }



    // =========================
    // HINDI
    // =========================

    else if (language === "hi") {


        document
        .getElementById("hospitalTitle")
        .innerText =
            "🏥 अस्पताल कतार प्रणाली";


        document
        .getElementById("languageLabel")
        .innerText =
            "🌐 भाषा:";


        document
        .getElementById("patientRegistration")
        .innerText =
            "मरीज पंजीकरण";


        document
        .getElementById("nameLabel")
        .innerText =
            "मरीज का नाम";


        document
        .getElementById("phoneLabel")
        .innerText =
            "मोबाइल नंबर";


        document
        .getElementById("name")
        .placeholder =
            "मरीज का नाम दर्ज करें";


        document
        .getElementById("phone")
        .placeholder =
            "मोबाइल नंबर दर्ज करें";


        document
        .getElementById("generateButton")
        .innerText =
            "टोकन जनरेट करें";


        document
        .getElementById("yourTokenText")
        .innerText =
            "आपका टोकन नंबर";


        document
        .getElementById("currentTitle")
        .innerText =
            "वर्तमान मरीज";


        document
        .getElementById("nextButton")
        .innerText =
            "अगला मरीज";


        document
        .getElementById("waitingTitle")
        .innerText =
            "प्रतीक्षा सूची";

    }



    // =========================
    // MARATHI
    // =========================

    else {


        document
        .getElementById("hospitalTitle")
        .innerText =
            "🏥 हॉस्पिटल रांग प्रणाली";


        document
        .getElementById("languageLabel")
        .innerText =
            "🌐 भाषा:";


        document
        .getElementById("patientRegistration")
        .innerText =
            "रुग्ण नोंदणी";


        document
        .getElementById("nameLabel")
        .innerText =
            "रुग्णाचे नाव";


        document
        .getElementById("phoneLabel")
        .innerText =
            "मोबाईल नंबर";


        document
        .getElementById("name")
        .placeholder =
            "रुग्णाचे नाव टाका";


        document
        .getElementById("phone")
        .placeholder =
            "मोबाईल नंबर टाका";


        document
        .getElementById("generateButton")
        .innerText =
            "टोकन तयार करा";


        document
        .getElementById("yourTokenText")
        .innerText =
            "तुमचा टोकन नंबर";


        document
        .getElementById("currentTitle")
        .innerText =
            "सध्याचा रुग्ण";


        document
        .getElementById("nextButton")
        .innerText =
            "पुढील रुग्ण";


        document
        .getElementById("waitingTitle")
        .innerText =
            "प्रतीक्षा यादी";

    }



    // UPDATE LIST

    showWaitingList();

}

</script>

</body>

</html>
