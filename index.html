<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Queue System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f7ff;
}

/* HEADER */

header {
    background: #0d6efd;
    color: white;

    padding: 15px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    flex-wrap: wrap;
    gap: 10px;
}

header h2 {
    margin: 0;
}

.language-box {
    display: flex;
    align-items: center;
    gap: 8px;
}

#languageSelect {
    padding: 8px 12px;

    border: none;
    border-radius: 6px;

    font-size: 15px;
    cursor: pointer;
}


/* MAIN */

.container {
    max-width: 750px;

    margin: 30px auto;

    background: white;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;

    color: #0d6efd;
}


/* FORM */

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;

    margin-bottom: 6px;

    font-weight: bold;
}

input {
    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 16px;
}


/* BUTTON */

button {
    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 7px;

    color: white;

    font-size: 16px;

    cursor: pointer;

    margin-top: 10px;
}


/* GENERATE */

.generate-btn {
    background: #0d6efd;
}

.generate-btn:hover {
    background: #0958c7;
}


/* NEXT */

.next-btn {
    background: #198754;
}

.next-btn:hover {
    background: #146c43;
}


/* SMS */

.sms-btn {
    background: #6f42c1;
}

.sms-btn:hover {
    background: #59339d;
}


/* TOKEN */

.token-box {
    margin-top: 25px;

    padding: 20px;

    background: #e7f1ff;

    border-radius: 10px;

    text-align: center;
}

.token-number {
    font-size: 45px;

    font-weight: bold;

    color: #0d6efd;
}


/* CURRENT PATIENT */

.current-box {
    margin-top: 25px;

    padding: 20px;

    background: #e8f5e9;

    border-radius: 10px;

    text-align: center;
}

.current-number {
    font-size: 45px;

    font-weight: bold;

    color: #198754;
}


/* WAITING LIST */

.waiting {
    margin-top: 30px;
}

.patient {
    background: #f8f9fa;

    border: 1px solid #ddd;

    padding: 14px;

    margin-bottom: 10px;

    border-radius: 8px;
}

.patient strong {
    color: #0d6efd;

    font-size: 18px;
}

.empty {
    text-align: center;

    color: #777;

    padding: 15px;
}


/* MESSAGE */

.message-box {
    margin-top: 20px;

    padding: 15px;

    background: #fff3cd;

    border: 1px solid #ffe69c;

    border-radius: 8px;

    display: none;
}

.message-text {
    background: white;

    padding: 15px;

    border-radius: 8px;

    line-height: 1.6;
}


/* MOBILE */

@media(max-width:600px) {

    header {
        flex-direction: column;

        text-align: center;
    }

    .language-box {
        justify-content: center;
    }

    .container {
        margin: 15px;

        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header>

    <h2 id="hospitalTitle">
        🏥 Hospital Queue System
    </h2>


    <div class="language-box">

        <span id="languageLabel">
            🌐 Language:
        </span>


        <select
            id="languageSelect"
            onchange="changeLanguage()">

            <option value="en">
                English
            </option>

            <option value="hi">
                हिंदी
            </option>

            <option value="mr">
                मराठी
            </option>

        </select>

    </div>

</header>



<!-- =====================================
     MAIN
===================================== -->

<div class="container">


    <h1 id="patientRegistration">
        Patient Registration
    </h1>


    <!-- PATIENT NAME -->

    <div class="form-group">

        <label id="nameLabel">

            Patient Name

        </label>


        <input
            type="text"
            id="name"
            placeholder="Enter patient name">

    </div>



    <!-- MOBILE -->

    <div class="form-group">

        <label id="phoneLabel">

            Mobile Number

        </label>


        <input
            type="tel"
            id="phone"
            placeholder="Enter mobile number">

    </div>



    <!-- GENERATE TOKEN -->

    <button
        class="generate-btn"
        id="generateButton"
        onclick="addPatient()">

        Generate Token

    </button>



    <!-- TOKEN -->

    <div class="token-box">

        <div id="yourTokenText">

            Your Token Number

        </div>


        <div
            class="token-number"
            id="tokenNumber">

            -

        </div>

    </div>



    <!-- CURRENT PATIENT -->

    <div class="current-box">

        <h2 id="currentTitle">

            Current Patient

        </h2>


        <div
            class="current-number"
            id="currentToken">

            -

        </div>

    </div>



    <!-- NEXT PATIENT -->

    <button
        class="next-btn"
        id="nextButton"
        onclick="nextPatient()">

        Next Patient

    </button>



    <!-- MESSAGE BOX -->

    <div
        class="message-box"
        id="messageBox">


        <h3 id="messageTitle">

            📢 Patient Message

        </h3>


        <div
            class="message-text"
            id="messageText">

        </div>


        <!-- OPEN SMS -->

        <button
            class="sms-btn"
            id="smsButton"
            onclick="openSMS()">

            📱 Open SMS

        </button>


    </div>



    <!-- WAITING LIST -->

    <div class="waiting">


        <h2 id="waitingTitle">

            Waiting List

        </h2>


        <div id="waitingList">

            <div class="empty">

                No patients waiting

            </div>

        </div>

    </div>


</div>



<script>


// =====================================
// QUEUE
// =====================================

let queue = [];

let tokenCounter = 0;

let currentToken = 0;

let currentPatient = null;



// =====================================
// ADD PATIENT
// =====================================

function addPatient() {


    let name =
        document
        .getElementById("name")
        .value
        .trim();


    let phone =
        document
        .getElementById("phone")
        .value
        .trim();


    let language =
        document
        .getElementById("languageSelect")
        .value;



    // EMPTY CHECK

    if (name === "" || phone === "") {


        if (language === "en") {

            alert(
                "Please enter patient name and mobile number."
            );

        }

        else if (language === "hi") {

            alert(
                "कृपया मरीज का नाम और मोबाइल नंबर दर्ज करें।"
            );

        }

        else {

            alert(
                "कृपया रुग्णाचे नाव आणि मोबाईल नंबर टाका."
            );

        }

        return;
    }



    // CLEAN MOBILE

    let cleanPhone =
        phone.replace(/\D/g, "");



    // VALIDATE MOBILE

    if (
        cleanPhone.length !== 10 &&
        !(
            cleanPhone.length === 12 &&
            cleanPhone.startsWith("91")
        )
    ) {


        if (language === "en") {

            alert(
                "Please enter a valid 10 digit mobile number."
            );

        }

        else if (language === "hi") {

            alert(
                "कृपया 10 अंकों का सही मोबाइल नंबर दर्ज करें।"
            );

        }

        else {

            alert(
                "कृपया 10 अंकी योग्य मोबाईल नंबर टाका."
            );

        }

        return;
    }



    // TOKEN

    tokenCounter++;



    let patient = {

        name: name,

        phone: cleanPhone,

        token: tokenCounter

    };



    // ADD QUEUE

    queue.push(patient);



    // SHOW TOKEN

    document
        .getElementById("tokenNumber")
        .innerText =
        tokenCounter;



    // CLEAR INPUT

    document
        .getElementById("name")
        .value = "";


    document
        .getElementById("phone")
        .value = "";



    // UPDATE LIST

    showWaitingList();



    // SUCCESS MESSAGE

    if (language === "en") {

        alert(
            "Token generated successfully!\n\n" +
            "Token Number: " +
            tokenCounter
        );

    }

    else if (language === "hi") {

        alert(
            "टोकन सफलतापूर्वक जनरेट हो गया!\n\n" +
            "टोकन नंबर: " +
            tokenCounter
        );

    }

    else {

        alert(
            "टोकन यशस्वीरित्या तयार झाले!\n\n" +
            "टोकन नंबर: " +
            tokenCounter
        );

    }

}



// =====================================
// NEXT PATIENT
// =====================================

function nextPatient() {


    let language =
        document
        .getElementById("languageSelect")
        .value;



    // NO PATIENT

    if (queue.length === 0) {


        if (language === "en") {

            alert(
                "No patients waiting."
            );

        }

        else if (language === "hi") {

            alert(
                "कोई मरीज प्रतीक्षा में नहीं है।"
            );

        }

        else {

            alert(
                "कोणतेही रुग्ण प्रतीक्षेत नाहीत."
            );

        }

        return;
    }



    // FIRST PATIENT

    currentPatient =
        queue.shift();



    // CURRENT TOKEN

    currentToken =
        currentPatient.token;



    document
        .getElementById("currentToken")
        .innerText =
        currentToken;



    // UPDATE WAITING LIST

    showWaitingList();



    // CREATE MESSAGE

    createPatientMessage(currentPatient);

}



// =====================================
// CREATE MESSAGE
// =====================================

function createPatientMessage(patient) {


    let language =
        document
        .getElementById("languageSelect")
        .value;


    let message = "";



    // ENGLISH

    if (language === "en") {


        message =
            "Hello " +
            patient.name +
            ", your turn has arrived. " +
            "Please come to the hospital. " +
            "Your token number is " +
            patient.token +
            ".";

    }



    // HINDI

    else if (language === "hi") {


        message =
            "नमस्ते " +
            patient.name +
            ", आपकी बारी आ गई है। " +
            "कृपया अस्पताल में आएं। " +
            "आपका टोकन नंबर " +
            patient.token +
            " है।";

    }



    // MARATHI

    else {


        message =
            "नमस्कार " +
            patient.name +
            ", तुमची बारी आली आहे। " +
            "कृपया हॉस्पिटलमध्ये या। " +
            "तुमचा टोकन नंबर " +
            patient.token +
            " आहे।";

    }



    // SHOW MESSAGE

    document
        .getElementById("messageText")
        .innerText =
        message;


    document
        .getElementById("messageBox")
        .style.display =
        "block";

}



// =====================================
// OPEN SMS
// =====================================

function openSMS() {


    if (!currentPatient) {

        alert(
            "Please click Next Patient first."
        );

        return;
    }



    // MOBILE NUMBER

    let phone =
        currentPatient.phone;



    // INDIA COUNTRY CODE

    if (phone.length === 10) {

        phone =
            "+91" + phone;

    }

    else if (
        phone.length === 12 &&
        phone.startsWith("91")
    ) {

        phone =
            "+" + phone;

    }



    // MESSAGE

    let message =
        document
        .getElementById("messageText")
        .innerText;



    // SMS LINK

    let smsURL =
        "sms:" +
        phone +
        "?body=" +
        encodeURIComponent(message);



    // OPEN SMS APP

    window.location.href =
        smsURL;

}



// =====================================
// WAITING LIST
// =====================================

function showWaitingList() {


    let list =
        document
        .getElementById("waitingList");



    // EMPTY

    if (queue.length === 0) {


        list.innerHTML =

            '<div class="empty">' +

            getText("empty") +

            '</div>';

        return;
    }



    list.innerHTML = "";



    // PATIENTS

    queue.forEach(function(patient) {


        let div =
            document.createElement("div");


        div.className =
            "patient";


        div.innerHTML =

            "<strong>" +

            getText("token") +

            " " +

            patient.token +

            "</strong><br><br>" +


            getText("name") +

            ": " +

            patient.name +

            "<br>" +


            getText("mobile") +

            ": " +

            patient.phone;


        list.appendChild(div);

    });

}



// =====================================
// TRANSLATION
// =====================================

function getText(type) {


    let language =
        document
        .getElementById("languageSelect")
        .value;



    let text = {


        en: {

            token: "Token",

            name: "Name",

            mobile: "Mobile",

            empty:
                "No patients waiting"

        },


        hi: {

            token: "टोकन",

            name: "नाम",

            mobile: "मोबाइल",

            empty:
                "कोई मरीज प्रतीक्षा में नहीं है"

        },


        mr: {

            token: "टोकन",

            name: "नाव",

            mobile: "मोबाईल",

            empty:
                "कोणतेही रुग्ण प्रतीक्षेत नाहीत"

        }

    };


    return text[language][type];

}



// =====================================
// CHANGE LANGUAGE
// =====================================

function changeLanguage() {


    let language =
        document
        .getElementById("languageSelect")
        .value;



    // ENGLISH

    if (language === "en") {


        document
        .getElementById("hospitalTitle")
        .innerText =
            "🏥 Hospital Queue System";


        document
        .getElementById("languageLabel")
        .innerText =
            "🌐 Language:";


        document
        .getElementById("patientRegistration")
        .innerText =
            "Patient Registration";


        document
        .getElementById("nameLabel")
        .innerText =
            "Patient Name";


        document
        .getElementById("phoneLabel")
        .innerText =
            "Mobile Number";


        document
        .getElementById("name")
        .placeholder =
            "Enter patient name";


        document
        .getElementById("phone")
        .placeholder =
            "Enter mobile number";


        document
        .getElementById("generateButton")
        .innerText =
            "Generate Token";


        document
        .getElementById("yourTokenText")
        .innerText =
            "Your Token Number";


        document
        .getElementById("currentTitle")
        .innerText =
            "Current Patient";


        document
        .getElementById("nextButton")
        .innerText =
            "Next Patient";


        document
        .getElementById("waitingTitle")
        .innerText =
            "Waiting List";


        document
        .getElementById("messageTitle")
        .innerText =
            "📢 Patient Message";


        document
        .getElementById("smsButton")
        .innerText =
            "📱 Open SMS";

    }



    // HINDI

    else if (language === "hi") {


        document
        .getElementById("hospitalTitle")
        .innerText =
            "🏥 अस्पताल कतार प्रणाली";


        document
        .getElementById("languageLabel")
        .innerText =
            "🌐 भाषा:";


        document
        .getElementById("patientRegistration")
        .innerText =
            "मरीज पंजीकरण";


        document
        .getElementById("nameLabel")
        .innerText =
            "मरीज का नाम";


        document
        .getElementById("phoneLabel")
        .innerText =
            "मोबाइल नंबर";


        document
        .getElementById("name")
        .placeholder =
            "मरीज का नाम दर्ज करें";


        document
        .getElementById("phone")
        .placeholder =
            "मोबाइल नंबर दर्ज करें";


        document
        .getElementById("generateButton")
        .innerText =
            "टोकन जनरेट करें";


        document
        .getElementById("yourTokenText")
        .innerText =
            "आपका टोकन नंबर";


        document
        .getElementById("currentTitle")
        .innerText =
            "वर्तमान मरीज";


        document
        .getElementById("nextButton")
        .innerText =
            "अगला मरीज";


        document
        .getElementById("waitingTitle")
        .innerText =
            "प्रतीक्षा सूची";


        document
        .getElementById("messageTitle")
        .innerText =
            "📢 मरीज का संदेश";


        document
        .getElementById("smsButton")
        .innerText =
            "📱 SMS खोलें";

    }



    // MARATHI

    else {


        document
        .getElementById("hospitalTitle")
        .innerText =
            "🏥 हॉस्पिटल रांग प्रणाली";


        document
        .getElementById("languageLabel")
        .innerText =
            "🌐 भाषा:";


        document
        .getElementById("patientRegistration")
        .innerText =
            "रुग्ण नोंदणी";


        document
        .getElementById("nameLabel")
        .innerText =
            "रुग्णाचे नाव";


        document
        .getElementById("phoneLabel")
        .innerText =
            "मोबाईल नंबर";


        document
        .getElementById("name")
        .placeholder =
            "रुग्णाचे नाव टाका";


        document
        .getElementById("phone")
        .placeholder =
            "मोबाईल नंबर टाका";


        document
        .getElementById("generateButton")
        .innerText =
            "टोकन तयार करा";


        document
        .getElementById("yourTokenText")
        .innerText =
            "तुमचा टोकन नंबर";


        document
        .getElementById("currentTitle")
        .innerText =
            "सध्याचा रुग्ण";


        document
        .getElementById("nextButton")
        .innerText =
            "पुढील रुग्ण";


        document
        .getElementById("waitingTitle")
        .innerText =
            "प्रतीक्षा यादी";


        document
        .getElementById("messageTitle")
        .innerText =
            "📢 रुग्णाचा संदेश";


        document
        .getElementById("smsButton")
        .innerText =
            "📱 SMS उघडा";

    }



    // UPDATE LIST

    showWaitingList();

}

</script>


</body>

</html>
