<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Language Change</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:50px;
    background:#f4f7fb;
}

.container{
    background:white;
    max-width:500px;
    margin:auto;
    padding:30px;
    border-radius:15px;
}

select, button{
    padding:12px;
    font-size:16px;
    margin:10px;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Smart Hospital Queue System</h1>

<select id="language" onchange="changeLanguage()">
    <option value="en">English</option>
    <option value="hi">हिंदी</option>
    <option value="mr">मराठी</option>
</select>

<h2 id="welcome">Welcome to Hospital Queue System</h2>

<input type="text" id="name" placeholder="Enter Patient Name">

<br>

<button id="button">Get Token</button>

</div>


<script>

const translations = {

en:{
    title:"Smart Hospital Queue System",
    welcome:"Welcome to Hospital Queue System",
    name:"Enter Patient Name",
    button:"Get Token"
},

hi:{
    title:"स्मार्ट हॉस्पिटल कतार प्रणाली",
    welcome:"हॉस्पिटल कतार प्रणाली में आपका स्वागत है",
    name:"मरीज का नाम दर्ज करें",
    button:"टोकन प्राप्त करें"
},

mr:{
    title:"स्मार्ट हॉस्पिटल रांग प्रणाली",
    welcome:"हॉस्पिटल रांग प्रणालीमध्ये आपले स्वागत आहे",
    name:"रुग्णाचे नाव टाका",
    button:"टोकन मिळवा"
}

};


function changeLanguage(){

    let language =
        document.getElementById("language").value;

    let t =
        translations[language];


    document.getElementById("title").innerText =
        t.title;

    document.getElementById("welcome").innerText =
        t.welcome;

    document.getElementById("name").placeholder =
        t.name;

    document.getElementById("button").innerText =
        t.button;

}

</script>

</body>
</html>
